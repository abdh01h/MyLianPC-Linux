[workspace]
resolver = "2"
members = [
    "crates/mylianpc-core",
    "crates/mylianpc-hardware",
    "crates/mylianpc-probe",
    "crates/mylianpc-service",
    "crates/mylianpc-ui",
    "crates/mylianpc-lcd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
authors = ["MyLianPC contributors"]

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
signal-hook = "0.3"
tiny-skia = "0.11"
ab_glyph = "0.2"
fontdb = "0.23"

[profile.release]
lto = "thin"
strip = true
